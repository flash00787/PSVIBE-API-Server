<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1626">
<title>PS VIBE — PS5 Gaming Lounge</title>
<style>
  :root{
    --bg1:#0a1626; --bg2:#14304f; --card:#16263c; --ink:#eaf2fb; --mut:#9db3cc;
    --line:#24374f; --green1:#25c65f; --green2:#149447; --violet1:#8a7bff; --violet2:#6a55e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100vh; min-height:100svh; padding:22px 18px;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,"Noto Sans Myanmar","Pyidaungsu","Myanmar Text",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, var(--bg2), transparent 62%),
      radial-gradient(700px 420px at 100% 110%, rgba(115,96,242,.18), transparent 60%),
      var(--bg1);
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{width:100%; max-width:420px}

  /* ── brand ── */
  .brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin:2px 0 16px}
  .logo{
    width:66px; height:66px; border-radius:20px; display:grid; place-items:center; font-size:31px;
    background:linear-gradient(145deg,#2a86ea,#0f4c9c);
    box-shadow:0 12px 28px rgba(42,134,234,.35), inset 0 1px 0 rgba(255,255,255,.25);
  }
  h1{margin:11px 0 0; font-size:23px; font-weight:800; letter-spacing:.4px}
  .sub{margin:3px 0 0; color:var(--mut); font-size:14px}
  .tag{margin-top:7px; font-size:12.5px; color:#8fd3ff; letter-spacing:.2px}

  /* ── action card ── */
  .card{
    border:1px solid var(--line); border-radius:22px; padding:18px 16px 16px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0) 42%), var(--card);
    box-shadow:0 18px 42px rgba(0,0,0,.45);
  }
  .hint{margin:0 0 14px; text-align:center; color:var(--mut); font-size:13.5px; line-height:1.6}
  a.b{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:17px 16px; margin:10px 0; border-radius:15px;
    color:#fff; font-weight:700; font-size:17px; text-decoration:none;
    transition:transform .07s ease, filter .15s ease;
  }
  a.b:active{transform:scale(.985); filter:brightness(1.05)}
  a.call{
    font-size:18.5px;
    background:linear-gradient(145deg,var(--green1),var(--green2));
    box-shadow:0 12px 26px rgba(34,197,94,.28), inset 0 1px 0 rgba(255,255,255,.22);
  }
  a.viber{
    background:linear-gradient(145deg,var(--violet1),var(--violet2));
    box-shadow:0 12px 26px rgba(115,96,242,.26), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .num{margin-top:12px; text-align:center; color:var(--mut); font-size:13px; letter-spacing:.6px}

  /* ── chips ── */
  .foot{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px}
  .chip{
    font-size:11.5px; color:#aec4dc; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); background:rgba(255,255,255,.035);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">🎮</div>
      <h1>PS VIBE</h1>
      <p class="sub">PS5 Gaming Lounge</p>
      <div class="tag">Play The Game. Share The VIBE!</div>
    </div>

    <div class="card">
      <p class="hint">ဖုန်းခေါ်ရန် အောက်က ခလုတ်ကို နှိပ်ပါ</p>
      <a class="b call" href="tel:+959773355915">📞&nbsp; Call +95 977 335 5915</a>
      <a class="b viber" href="https://ps-vibe.com/webapp/viber.html">💬&nbsp; Viber နဲ့ ဆက်သွယ်ရန်</a>
      <div class="num">+95 977 335 5915</div>
    </div>

    <div class="foot">
      <span class="chip">🕘 9:00 AM – 9:00 PM</span>
      <span class="chip">📍 Yangon</span>
      <span class="chip">🎮 PS5 Consoles</span>
    </div>
  </div>
</body>
</html>
