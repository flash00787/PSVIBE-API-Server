<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PS VIBE — Mini App</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="psv-build" content="w54mmqrcrecipe2" />
  <!-- Vendor: Vant 4 (local, no runtime CDN) -->
  <link rel="stylesheet" href="vendor/vant.css" />
  <link rel="stylesheet" href="style.css?v=w54mmqrcrecipe2" />
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Standalone "native app" theme — active ONLY when not inside Telegram.
       Set before first paint so there is no flash; app.js re-checks in boot(). -->
  <script>
    (function () {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!(tg && tg.initData)) document.documentElement.classList.add("psv-native");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="native-theme.css?v=w54mmqrcrecipe2" />
</head>
<body>
  <div id="app" v-cloak>
    <!-- App shell -->
    <transition name="van-slide-up">
      <router-view v-slot="{ Component }">
        <keep-alive :max="8">
          <component :is="Component" />
        </keep-alive>
      </router-view>
    </transition>

    <!-- Bottom Tabbar -->
    <van-tabbar
      v-model="activeTab"
      route
      active-color="#818cf8"
      inactive-color="#64748b"
      :safe-area-inset-bottom="true"
      class="app-tabbar"
    >
      <van-tabbar-item name="/" icon="wap-home-o">Home</van-tabbar-item>
      <van-tabbar-item name="/sales" icon="balance-list-o">Sales</van-tabbar-item>
      <van-tabbar-item name="/members" icon="friends-o">Members</van-tabbar-item>
      <van-tabbar-item name="/bookings" icon="calendar-o">Bookings</van-tabbar-item>
      <van-tabbar-item name="/more" icon="apps-o">More</van-tabbar-item>
    </van-tabbar>
  </div>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/vant.min.js"></script>
  <script src="api.js?v=w54mmqrcrecipe2"></script>
  <script src="app.js?v=w54mmqrcrecipe2"></script>
</body>
</html>
