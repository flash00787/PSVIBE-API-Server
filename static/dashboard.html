<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS VIBE — Dashboard</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
  --dim: #8b949e; --cyan: #00d4ff; --magenta: #ff00ff; --green: #3fb950;
  --amber: #d2991d; --red: #f85149; --input-bg: #0d1117; --hover: #1c2128;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--cyan); text-decoration:none; }

/* ═══ LOGIN PAGE ═══ */
.login-page { display:flex; align-items:center; justify-content:center; min-height:100vh;
  background:linear-gradient(135deg,#0a0e14 0%,#141028 30%,#1a1640 50%,#141028 70%,#0a0e14 100%); }
.login-card { background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:2.5rem; width:100%; max-width:420px; box-shadow:0 0 60px rgba(0,212,255,0.08); }
.login-logo { text-align:center; margin-bottom:2rem; }
.login-logo h1 { font-size:2rem; font-weight:800; background:linear-gradient(135deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.login-logo p { color:var(--dim); font-size:0.85rem; margin-top:0.25rem; }
.form-group { margin-bottom:1.25rem; }
.form-group label { display:block; font-size:0.82rem; color:var(--dim); margin-bottom:0.35rem;
  font-weight:500; text-transform:uppercase; letter-spacing:0.05em; }
.form-group input { width:100%; background:var(--input-bg); border:1px solid var(--border);
  color:var(--text); padding:0.7rem 0.85rem; border-radius:8px; font-size:0.95rem;
  transition:border-color 0.2s; }
.form-group input:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,212,255,0.1); }
.login-btn { width:100%; padding:0.75rem; border:none; border-radius:8px;
  background:linear-gradient(135deg,var(--cyan),var(--magenta)); color:#fff;
  font-size:1rem; font-weight:600; cursor:pointer; transition:opacity 0.2s; }
.login-btn:hover { opacity:0.9; }
.login-btn:disabled { opacity:0.5; cursor:not-allowed; }
.login-error { background:rgba(248,81,73,0.1); border:1px solid var(--red); color:var(--red);
  padding:0.6rem 0.85rem; border-radius:8px; font-size:0.85rem; margin-bottom:1rem;
  display:none; }
.login-error.show { display:block; }
.login-spinner { display:none; width:20px; height:20px; border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite;
  margin:0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══ DASHBOARD ═══ */
.dashboard-page { display:none; }
.topbar { background:linear-gradient(135deg,#0a0e14 0%,#141028 30%,#1a1640 50%,#141028 70%,#0a0e14 100%);
  padding:0.7rem 1.5rem; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
.topbar-logo { font-size:1.35rem; font-weight:800;
  background:linear-gradient(135deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.topbar-right { display:flex; align-items:center; gap:0.75rem; }
.topbar-user { color:var(--text); font-size:0.9rem; }
.role-badge { padding:0.2rem 0.55rem; border-radius:12px; font-size:0.7rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.05em; }
.role-badge.admin { background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3); }
.role-badge.staff { background:rgba(63,185,80,0.15); color:var(--green); border:1px solid rgba(63,185,80,0.3); }
.logout-btn { background:var(--border); color:var(--text); border:none;
  padding:0.35rem 0.75rem; border-radius:6px; cursor:pointer; font-size:0.82rem;
  transition:all 0.2s; }
.logout-btn:hover { background:var(--red); color:#fff; }

/* Nav Tabs */
.nav { background:var(--card); border-bottom:1px solid var(--border); display:flex;
  overflow-x:auto; padding:0 0.5rem; -webkit-overflow-scrolling:touch; }
.nav button { background:none; border:none; color:var(--dim); padding:0.85rem 0.9rem;
  cursor:pointer; font-size:0.9rem; font-weight:500; white-space:nowrap;
  border-bottom:2px solid transparent; transition:all 0.2s; }
.nav button:hover { color:var(--text); }
.nav button.active { color:var(--cyan); border-bottom-color:var(--cyan); }

/* Main Content */
.main { max-width:1400px; margin:0 auto; padding:1.5rem; }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* KPI Cards */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:1.25rem; position:relative; overflow:hidden; }
.kpi-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; }
.kpi-card.cyan::before { background:var(--cyan); }
.kpi-card.magenta::before { background:var(--magenta); }
.kpi-card.green::before { background:var(--green); }
.kpi-card.amber::before { background:var(--amber); }
.kpi-card .label { font-size:0.78rem; color:var(--dim); text-transform:uppercase;
  letter-spacing:0.05em; margin-bottom:0.25rem; }
.kpi-card .value { font-size:1.6rem; font-weight:700; }
.kpi-card .value.cyan { color:var(--cyan); }
.kpi-card .value.magenta { color:var(--magenta); }
.kpi-card .value.green { color:var(--green); }
.kpi-card .value.amber { color:var(--amber); }

/* Panels */
.panel { background:var(--card); border:1px solid var(--border); border-radius:12px;
  margin-bottom:1.5rem; overflow:hidden; }
.panel-header { padding:0.85rem 1rem; border-bottom:1px solid var(--border);
  font-weight:600; font-size:0.95rem; display:flex; justify-content:space-between;
  align-items:center; flex-wrap:wrap; gap:0.5rem; }
.panel-body { padding:1rem; }

/* Controls */
.controls { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
.controls input, .controls select { background:var(--input-bg); border:1px solid var(--border);
  color:var(--text); padding:0.45rem 0.7rem; border-radius:6px; font-size:0.85rem; }
.controls input:focus, .controls select:focus { outline:none; border-color:var(--cyan); }
.controls input { width:200px; }

/* Tables */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:0.85rem; }
th, td { padding:0.5rem 0.7rem; text-align:left; border-bottom:1px solid var(--border);
  white-space:nowrap; }
th { color:var(--dim); font-weight:500; font-size:0.75rem; text-transform:uppercase; }
tr:hover { background:var(--hover); }

/* Buttons */
.btn { padding:0.3rem 0.65rem; border-radius:4px; border:none; cursor:pointer;
  font-size:0.78rem; font-weight:500; transition:all 0.15s; }
.btn-cyan { background:var(--cyan); color:#000; }
.btn-cyan:hover { opacity:0.85; }
.btn-magenta { background:var(--magenta); color:#fff; }
.btn-magenta:hover { opacity:0.85; }
.btn-green { background:var(--green); color:#000; }
.btn-green:hover { opacity:0.85; }
.btn-red { background:var(--red); color:#fff; }
.btn-red:hover { opacity:0.85; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--cyan); color:var(--cyan); }
.btn-sm { font-size:0.72rem; padding:0.2rem 0.45rem; }
.action-btns { display:flex; gap:0.3rem; flex-wrap:wrap; }

/* Console Grid */
.console-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:0.75rem; }
.console-card { background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:0.85rem; text-align:center; transition:all 0.2s; }
.console-card .console-id { font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.console-card .console-status { font-size:0.75rem; font-weight:600;
  padding:0.15rem 0.45rem; border-radius:10px; display:inline-block; }
.console-card.available { border-color:rgba(63,185,80,0.3); }
.console-card.available .console-status { background:rgba(63,185,80,0.15); color:var(--green); }
.console-card.active, .console-card.playing { border-color:rgba(0,212,255,0.3); }
.console-card.active .console-status, .console-card.playing .console-status { background:rgba(0,212,255,0.15); color:var(--cyan); }
.console-card.reserved { border-color:rgba(210,153,29,0.3); }
.console-card.reserved .console-status { background:rgba(210,153,29,0.15); color:var(--amber); }
.console-card.maintenance { border-color:rgba(248,81,73,0.3); }
.console-card.maintenance .console-status { background:rgba(248,81,73,0.15); color:var(--red); }
.console-card .console-game { font-size:0.72rem; color:var(--dim); margin-top:0.25rem;
  overflow:hidden; text-overflow:ellipsis; }

/* Timeline */
.timeline-grid { display:grid; grid-template-columns:80px repeat(10,1fr); gap:1px;
  background:var(--border); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.timeline-header { background:var(--card); padding:0.4rem 0.3rem; font-size:0.68rem;
  color:var(--dim); text-align:center; font-weight:600; }
.timeline-header.console-label { text-align:right; padding-right:0.5rem; }
.timeline-row { display:contents; }
.timeline-cell { background:var(--bg); padding:0.2rem; min-height:28px; position:relative; }
.timeline-booking { position:absolute; top:2px; bottom:2px; border-radius:3px;
  font-size:0.6rem; padding:1px 3px; overflow:hidden; white-space:nowrap;
  text-overflow:ellipsis; color:#fff; display:flex; align-items:center; }
.timeline-booking.confirmed { background:var(--green); }
.timeline-booking.pending { background:var(--amber); }
.timeline-booking.active { background:var(--cyan); }
.timeline-booking.done { background:rgba(139,148,158,0.4); }

/* Game Cards */
.game-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
.game-card { background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:1rem; transition:border-color 0.2s; }
.game-card:hover { border-color:var(--cyan); }
.game-card .game-title { font-size:1rem; font-weight:600; color:var(--cyan); margin-bottom:0.35rem; }
.game-card .game-meta { font-size:0.78rem; color:var(--dim); display:flex; gap:0.75rem;
  flex-wrap:wrap; margin-bottom:0.5rem; }
.game-card .game-consoles { font-size:0.75rem; color:var(--dim); margin-top:0.5rem; }
.game-card .game-consoles span { display:inline-block; background:rgba(0,212,255,0.1);
  color:var(--cyan); padding:0.1rem 0.4rem; border-radius:3px; margin:0.15rem;
  font-size:0.7rem; }

/* Status badges */
.status { padding:0.15rem 0.45rem; border-radius:10px; font-size:0.7rem; font-weight:600; }
.status.confirmed { background:rgba(63,185,80,0.15); color:var(--green); }
.status.pending { background:rgba(210,153,29,0.15); color:var(--amber); }
.status.active, .status.playing { background:rgba(0,212,255,0.15); color:var(--cyan); }
.status.done, .status.completed { background:rgba(139,148,158,0.15); color:var(--dim); }
.status.rejected { background:rgba(248,81,73,0.15); color:var(--red); }

/* Filter tabs */
.filter-tabs { display:flex; gap:0.3rem; margin-bottom:0.75rem; }
.filter-tab { background:var(--input-bg); border:1px solid var(--border); color:var(--dim);
  padding:0.35rem 0.8rem; border-radius:6px; cursor:pointer; font-size:0.8rem; }
.filter-tab.active { background:rgba(0,212,255,0.1); border-color:var(--cyan); color:var(--cyan); }
.filter-tab:hover { color:var(--text); }

/* Empty/Loading/Error */
.empty, .loading, .error { text-align:center; padding:2rem; color:var(--dim); font-size:0.9rem; }
.error { color:var(--red); }
.loading { color:var(--cyan); }

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); z-index:1000; justify-content:center;
  align-items:center; padding:1rem; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:12px;
  width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
.modal-header { padding:1rem 1.25rem; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:1.05rem; }
.modal-close { background:none; border:none; color:var(--dim); cursor:pointer;
  font-size:1.2rem; }
.modal-close:hover { color:var(--red); }
.modal-body { padding:1.25rem; }
.modal-footer { padding:1rem 1.25rem; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end; gap:0.5rem; }

/* Toast */
.toast { position:fixed; top:1rem; right:1rem; z-index:2000; padding:0.7rem 1.2rem;
  border-radius:8px; font-size:0.85rem; font-weight:500; color:#fff;
  animation:slideIn 0.3s ease; max-width:360px; }
.toast.success { background:var(--green); }
.toast.error { background:var(--red); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* Responsive */
@media (max-width:768px) {
  .main { padding:1rem; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .console-grid { grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); }
  .topbar { padding:0.6rem 1rem; }
}

/* Users table extra column styles */
td .user-status { display:inline-block; width:8px; height:8px; border-radius:50%;
  margin-right:0.5rem; }
td .user-status.active { background:var(--green); }
td .user-status.inactive { background:var(--red); }
</style>
</head>
<body>

<!-- ═══════════ LOGIN PAGE ═══════════ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>PS VIBE</h1>
      <p>Console Gaming Center — Staff Dashboard</p>
    </div>
    <div id="login-error" class="login-error"></div>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        <span id="login-btn-text">Sign In</span>
        <div class="login-spinner" id="login-spinner"></div>
      </button>
    </form>
  </div>
</div>

<!-- ═══════════ DASHBOARD PAGE ═══════════ -->
<div id="dashboard-page" class="dashboard-page">
  <div class="topbar">
    <div class="topbar-logo">PS VIBE</div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user-name"></span>
      <span class="role-badge" id="topbar-role-badge"></span>
      <button class="logout-btn" onclick="showChangePwModal()" style="margin-right:0">🔑 Password</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="nav" id="nav-tabs"></div>
  <div class="main" id="main-content"></div>
</div>

<!-- ═══════════ MODALS ═══════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast-container"></div>

<script>
// ═══════════ AUTH STATE ═══════════
let currentUser = null;
let accessToken = null;
let refreshToken = null;

const API_BASE = '';

function checkAuth() {
  const stored = localStorage.getItem('psvibe_auth');
  if (!stored) {
    showLogin();
    return false;
  }
  try {
    const auth = JSON.parse(stored);
    accessToken = auth.access_token;
    refreshToken = auth.refresh_token;
    currentUser = auth.user;
    showDashboard();
    return true;
  } catch(e) {
    localStorage.removeItem('psvibe_auth');
    showLogin();
    return false;
  }
}

function showLogin() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('dashboard-page').style.display = 'none';
}

function showDashboard() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('dashboard-page').style.display = 'block';
  document.getElementById('topbar-user-name').textContent = currentUser.name || currentUser.username;
  const badge = document.getElementById('topbar-role-badge');
  badge.textContent = currentUser.role;
  badge.className = 'role-badge ' + currentUser.role;
  buildNav();
  switchTab('dashboard');
}

async function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const btnText = document.getElementById('login-btn-text');
  const spinner = document.getElementById('login-spinner');

  errEl.classList.remove('show');
  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';

  try {
    const resp = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = data.detail || 'Invalid username or password';
      errEl.classList.add('show');
      btn.disabled = false;
      btnText.style.display = '';
      spinner.style.display = 'none';
      return;
    }
    // Store tokens
    const auth = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user: data.user
    };
    localStorage.setItem('psvibe_auth', JSON.stringify(auth));
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    currentUser = data.user;
    showDashboard();
  } catch(e) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btnText.style.display = '';
    spinner.style.display = 'none';
  }
}

function logout() {
  localStorage.removeItem('psvibe_auth');
  accessToken = null;
  refreshToken = null;
  currentUser = null;
  showLogin();
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').classList.remove('show');
}

// ═══════════ API HELPERS ═══════════
async function apiGet(url) {
  const resp = await fetch(API_BASE + url, {
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    }
  });
  if (resp.status === 401) {
    // Try refresh
    const refreshed = await tryRefresh();
    if (refreshed) {
      const r2 = await fetch(API_BASE + url, {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      return r2.json();
    }
    logout();
    throw new Error('Session expired');
  }
  return resp.json();
}

async function apiPost(url, body) {
  const resp = await fetch(API_BASE + url, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (resp.status === 401) {
    const refreshed = await tryRefresh();
    if (refreshed) {
      const r2 = await fetch(API_BASE + url, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      return r2.json();
    }
    logout();
    throw new Error('Session expired');
  }
  return resp.json();
}

async function apiPut(url, body) {
  const resp = await fetch(API_BASE + url, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (resp.status === 401) {
    const refreshed = await tryRefresh();
    if (refreshed) {
      const r2 = await fetch(API_BASE + url, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      return r2.json();
    }
    logout();
    throw new Error('Session expired');
  }
  return resp.json();
}

async function apiDelete(url) {
  const resp = await fetch(API_BASE + url, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + accessToken }
  });
  if (resp.status === 401) {
    const refreshed = await tryRefresh();
    if (refreshed) {
      const r2 = await fetch(API_BASE + url, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      return r2.json();
    }
    logout();
    throw new Error('Session expired');
  }
  return resp.json();
}

async function tryRefresh() {
  try {
    const resp = await fetch(API_BASE + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if (!resp.ok) return false;
    const data = await resp.json();
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    currentUser = data.user;
    const stored = JSON.parse(localStorage.getItem('psvibe_auth') || '{}');
    stored.access_token = data.access_token;
    stored.refresh_token = data.refresh_token;
    stored.user = data.user;
    localStorage.setItem('psvibe_auth', JSON.stringify(stored));
    return true;
  } catch(e) {
    return false;
  }
}

    { id: 'inventory', label: '📦 Inventory', icon: '' },
    { id: 'users', label: '👷 Users', icon: '' },
    { id: 'finance', label: '💵 Finance', icon: '' },

    `<button id="nav-${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(tabId) {
  // Role guard: staff users can only access their 4 tabs
  if (currentUser && currentUser.role !== 'admin') {
    const staffAllowed = ['dashboard', 'booking', 'timeline', 'games'];
    if (!staffAllowed.includes(tabId)) {
      document.getElementById('main-content').innerHTML = '<div class="empty">⛔ Access denied. Admin only.</div>';
      return;
    }
  }

  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + tabId);
  if (navBtn) navBtn.classList.add('active');

  const main = document.getElementById('main-content');

  switch(tabId) {
    case 'dashboard': loadDashboardTab(main); break;
    case 'booking': loadBookingTab(main); break;
    case 'timeline': loadTimelineTab(main); break;
    case 'games': loadGamesTab(main); break;
    case 'members': loadMembersTab(main); break;
    case 'wallet': loadWalletTab(main); break;
    case 'sales': loadSalesTab(main); break;
    case 'inventory': loadInventoryTab(main); break;
    case 'users': loadUsersTab(main); break;
    case 'finance': loadFinanceTab(main); break;
    case 'analytics': loadAnalyticsTab(main); break;
    default: main.innerHTML = '<div class="empty">Tab not found</div>';
  }
}

// ═══════════ TOAST ═══════════
function toast(msg, type) {
  type = type || 'success';
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, 3000);
}

// ═══════════ FORMATTING ═══════════
function F(n) { return n != null ? Number(n).toLocaleString() : '-'; }
function FKS(n) { return n != null ? Number(n).toLocaleString() + ' Ks' : '-'; }

// ═══════════ TAB: DASHBOARD ═══════════
async function loadDashboardTab(container) {
  container.innerHTML = '<div class="loading">Loading dashboard...</div>';
  try {
    const [statsRes, consolesRes] = await Promise.all([
      apiGet('/api/dashboard/stats'),
      apiGet('/api/dashboard/consoles')
    ]);

    let html = '';

    // KPI Cards
    if (statsRes.success) {
      const s = statsRes.data;
      html += '<div class="kpi-grid">';
      html += kpiCard('Today Bookings', F(s.today_bookings || 0), 'cyan');
      html += kpiCard('Active Sessions', F(s.active_players || 0), 'green');
      html += kpiCard('Today Revenue', FKS(s.today_revenue || 0), 'amber');
      html += kpiCard('Free Consoles', F(consolesRes.success ?
        (consolesRes.data || []).filter(c => (c.status||'').toLowerCase() === 'available').length : 0), 'magenta');
      html += '</div>';
    }

    // Console Grid
    html += '<div class="panel"><div class="panel-header">🕹️ Console Status</div><div class="panel-body">';
    if (consolesRes.success && consolesRes.data.length) {
      html += '<div class="console-grid">';

        html += `<div class="console-card ${status}">

          <div class="console-status">${c.status || 'Available'}</div>
          ${c.current_game ? `<div class="console-game">${c.current_game}</div>` : ''}
        </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="empty">No console data</div>';
    }
    html += '</div></div>';

    // Today's Schedule
    html += '<div class="panel"><div class="panel-header">📋 Today\'s Schedule</div><div class="panel-body">';
    try {
      const today = new Date().toISOString().split('T')[0];
      const bookingsRes = await apiGet('/api/dashboard/bookings?date=' + today + '&limit=20');
      if (bookingsRes.success && bookingsRes.data && bookingsRes.data.length) {
        html += '<div class="table-wrap"><table><thead><tr>';
        html += '<th>Time</th><th>Console</th><th>Member</th><th>Game</th><th>Duration</th><th>Status</th></tr></thead><tbody>';

          const st = (b.status || '').toLowerCase();
          html += `<tr>
            <td>${b.start_time||'-'}</td>
            <td>${b.console_id||'-'}</td>
            <td>${b.member_id||'-'}</td>
            <td>${b.game_name||'-'}</td>
            <td>${b.duration_mins||'-'} min</td>

      }
    } catch(e) {
      html += '<div class="empty">Could not load schedule</div>';
    }
    html += '</div></div>';

    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div class="error">Error loading dashboard: ' + e.message + '</div>';
  }

// ═══════════ TAB: TIMELINE ═══════════
async function loadTimelineTab(container) {
  container.innerHTML = '<div class="loading">Loading timeline...</div>';
  try {
    // Use MMT date (not UTC) to match Myanmar lounge hours
    const now = new Date();
    const mmt = new Date(now.getTime() + (6.5 * 60 * 60 * 1000));
    const today = mmt.toISOString().split('T')[0];
    const res = await apiGet('/api/dashboard/bookings?date=' + today + '&limit=200');
    if (!res.success) {
      container.innerHTML = '<div class="error">' + (res.error || 'Failed') + '</div>';
      return;
    }
    const bookings = res.data || [];
    if (!bookings.length) {
      container.innerHTML = '<div class="empty">No bookings for today (' + today + ' MMT)</div>';
      return;
    }

    // Build console list from bookings
    const consoles = [...new Set(bookings.map(b => b.console_id).filter(Boolean))].sort();
    if (!consoles.length) {
      container.innerHTML = '<div class="empty">No console data</div>';
      return;
    }

    // Show hours 9 AM to 11 PM (MMT lounge hours)
    const hours = [];
    for (let h = 9; h <= 23; h++) hours.push(h);

    // Helper: parse time from datetime string (handles both "HH:MM" and "YYYY-MM-DD HH:MM:SS")
    const parseHour = (t) => {
      if (!t) return 0;
      const timePart = t.includes(' ') ? t.split(' ')[1] : t;
      return parseInt(timePart.split(':')[0]) || 0;
    };
    const parseMin = (t) => {
      if (!t) return 0;
      const timePart = t.includes(' ') ? t.split(' ')[1] : t;
      return parseInt(timePart.split(':')[1]) || 0;
    };

    let html = '<div class="panel"><div class="panel-header">⏱️ Today\'s Timeline (' + today + ' MMT)</div><div class="panel-body" style="overflow-x:auto">';
    html += '<div class="timeline-grid">';
    // Header
    html += '<div class="timeline-header console-label">Console</div>';
    const totalHours = hours.length;
    hours.forEach(h => {
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      html += `<div class="timeline-header">${h12}${ampm}</div>`;
    });

    // Rows
    const colors = { confirmed: 'confirmed', pending: 'pending', active: 'active', checked_in: 'active' };
    const defaultColor = 'done';

    consoles.forEach(cid => {
      html += `<div class="timeline-row">`;
      html += `<div class="timeline-header console-label" style="background:var(--card);text-align:right;padding-right:0.5rem">${cid}</div>`;
      
      // Collect bookings for this console, compute slot positions
      const consoleBookings = bookings.filter(b => b.console_id === cid);
      const slots = [];
      consoleBookings.forEach(b => {
        const sh = parseHour(b.start_time);
        const sm = parseMin(b.start_time);
        const eh = parseHour(b.end_time);
        const em = parseMin(b.end_time);
        const startDecimal = sh + sm / 60;
        const endDecimal = eh + em / 60;
        if (endDecimal > startDecimal) {
          slots.push({
            ...b,
            startDecimal,
            endDecimal,
            cls: colors[(b.status || '').toLowerCase()] || defaultColor
          });
        }
      });

      hours.forEach(h => {
        html += `<div class="timeline-cell">`;
        slots.filter(s => h >= Math.floor(s.startDecimal) && h < Math.ceil(s.endDecimal)).forEach(s => {
          const spanH = s.endDecimal - s.startDecimal;
          const leftPct = ((s.startDecimal - hours[0]) / totalHours) * 100;
          const widthPct = (spanH / totalHours) * 100;
          const label = (s.member_id || s.staff_name || '#' + s.id) + (s.game_name ? ' ' + s.game_name : '');
          html += `<div class="timeline-booking ${s.cls}" style="left:${leftPct}%;width:${widthPct}%" title="${label} | ${s.start_time} - ${s.end_time}">${label}</div>`;
        });
        html += '</div>';
      });
      html += '</div>';
    });

    html += '</div></div></div>';
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

        <div class="controls">
          <input type="date" id="sales-date" value="${new Date().toISOString().split('T')[0]}" onchange="refreshSales()">
          <button class="btn btn-cyan" onclick="refreshSales()">Load</button>
        </div>
        <div id="sales-content"><div class="loading">Loading...</div></div>
      </div>
    </div>`;
  refreshSales();
}

async function refreshSales() {
  const date = document.getElementById('sales-date').value;
  const content = document.getElementById('sales-content');
  content.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await apiGet('/api/dashboard/sales-daily?date=' + date + '&limit=200');
    if (!res.success) {
      content.innerHTML = '<div class="error">' + (res.error || 'Failed') + '</div>';
      return;
    }
    const data = res.data || [];
    if (!data.length) {
      content.innerHTML = '<div class="empty">No sales for this date</div>';
      return;
    }

    let totalNet = 0;
    data.forEach(s => totalNet += (s.net || 0));

    let html = `<div style="margin-bottom:1rem;font-size:0.9rem;color:var(--amber)">
      Total: ${data.length} vouchers · Net: ${FKS(totalNet)}
    </div>`;
    html += '<div class="table-wrap"><table><thead><tr>';
    html += '<th>Voucher</th><th>Console</th><th>Member</th><th>Game Amt</th><th>Food Amt</th><th>Gross</th><th>Discount</th><th>Net</th><th>Staff</th><th>Payment</th></tr></thead><tbody>';
    data.forEach(s => {
      html += `<tr>
        <td>${s.voucher_no||'-'}</td>
        <td>${s.console_id||'-'}</td>
        <td>${s.member_id||'-'}</td>
        <td>${FKS(s.game_amt||s.amount)}</td>
        <td>${FKS(s.food_amt||0)}</td>
        <td>${FKS(s.gross)}</td>
        <td>${FKS(s.discount)}</td>
        <td>${FKS(s.net)}</td>
        <td>${s.staff_name||'-'}</td>
        <td>${s.payment_method||'-'}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

// ═══════════ TAB: INVENTORY ═══════════
async function loadInventoryTab(container) {
  container.innerHTML = `
    <div class="panel">
      <div class="panel-header">📦 Inventory</div>
      <div class="panel-body">
        <div class="controls">
          <input type="text" id="inventory-search" placeholder="Search items..." oninput="refreshInventory()">
        </div>
        <div id="inventory-content"><div class="loading">Loading...</div></div>
      </div>
    </div>`;
  window._inventoryData = [];
  try {
    const res = await apiGet('/api/dashboard/inventory?limit=500');
    if (res.success) window._inventoryData = res.data || [];
    renderInventory();
  } catch(e) {
    document.getElementById('inventory-content').innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

function refreshInventory() { renderInventory(); }

function renderInventory() {
  const search = (document.getElementById('inventory-search')?.value || '').toLowerCase();
  let data = window._inventoryData || [];
  if (search) data = data.filter(i => (i.item_name || '').toLowerCase().includes(search));

  const content = document.getElementById('inventory-content');
  if (!data.length) {
    content.innerHTML = '<div class="empty">No items found</div>';
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr>';
  html += '<th>ID</th><th>Item</th><th>Category</th><th>Qty</th><th>Unit Price</th><th>Reorder Level</th><th>Last Updated</th></tr></thead><tbody>';
  data.forEach(i => {
    const low = i.quantity <= i.reorder_level && i.reorder_level > 0;
    html += `<tr>
      <td>${i.id}</td>
      <td>${i.item_name}</td>
      <td>${i.category||'-'}</td>
      <td style="color:${low ? 'var(--red)' : 'var(--text)'}">${F(i.quantity)}</td>
      <td>${FKS(i.unit_price)}</td>
      <td>${F(i.reorder_level)}</td>
      <td>${(i.last_updated||'').substring(0,10)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  content.innerHTML = html;
}

// ═══════════ TAB: USERS (Admin) ═══════════
async function loadUsersTab(container) {
  container.innerHTML = `
    <div class="panel">
      <div class="panel-header">👷 Dashboard Users <button class="btn btn-cyan btn-sm" onclick="showUserModal()">+ Add User</button></div>
      <div class="panel-body">
        <div id="users-content"><div class="loading">Loading...</div></div>
      </div>
    </div>`;
  refreshUsers();
}

async function refreshUsers() {
  const content = document.getElementById('users-content');
  content.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const res = await apiGet('/api/dashboard/users');
    if (!res.success) {
      content.innerHTML = '<div class="error">' + (res.error || 'Failed') + '</div>';
      return;
    }
    const data = res.data || [];
    if (!data.length) {
      content.innerHTML = '<div class="empty">No users found</div>';
      return;
    }

    let html = '<div class="table-wrap"><table><thead><tr>';
    html += '<th>ID</th><th>Username</th><th>Display Name</th><th>Role</th><th>Staff ID</th><th>Active</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>';
    data.forEach(u => {
      html += `<tr>
        <td>${u.id}</td>
        <td><strong>${u.username}</strong></td>
        <td>${u.display_name||'-'}</td>
        <td><span class="role-badge ${u.role}">${u.role}</span></td>
        <td>${u.staff_id||'-'}</td>
        <td><span class="user-status ${u.is_active ? 'active' : 'inactive'}"></span>${u.is_active ? 'Active' : 'Inactive'}</td>
        <td>${(u.last_login||'').substring(0,16)||'Never'}</td>
        <td><div class="action-btns">
          <button class="btn btn-outline btn-sm" onclick="editUser(${u.id},'${u.username}','${u.role}','${(u.display_name||'').replace(/'/g,"\\'")}',${u.is_active})">✏️ Edit</button>
          ${u.username !== 'admin' ? `<button class="btn btn-red btn-sm" onclick="deactivateUser(${u.id},'${u.username}')">🗑 Deactivate</button>` : ''}
        </div></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

function showUserModal() {
  showModal('Add Dashboard User', `
    <form onsubmit="return createUser(event)">
      <div class="form-group"><label>Username</label><input type="text" id="mu-username" required minlength="3"></div>
      <div class="form-group"><label>Password</label><input type="password" id="mu-password" required minlength="4"></div>
      <div class="form-group"><label>Display Name</label><input type="text" id="mu-display-name"></div>
      <div class="form-group"><label>Role</label><select id="mu-role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
      <div class="form-group"><label>Staff ID (optional)</label><input type="text" id="mu-staff-id"></div>
      <div class="modal-footer" style="border-top:none;padding:0;margin-top:1rem">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-cyan">Create User</button>
      </div>
    </form>
  `);
}

async function createUser(e) {
  e.preventDefault();
  const body = {
    username: document.getElementById('mu-username').value.trim(),
    password: document.getElementById('mu-password').value,
    display_name: document.getElementById('mu-display-name').value.trim() || undefined,
    role: document.getElementById('mu-role').value,
    staff_id: document.getElementById('mu-staff-id').value.trim() || undefined,
  };
  try {
    const res = await apiPost('/api/dashboard/users', body);
    if (res.success) { toast(res.message || 'User created', 'success'); closeModal(); refreshUsers(); }
    else { toast(res.error || 'Failed', 'error'); }
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function editUser(id, username, role, displayName, isActive) {
  showModal('Edit User: ' + username, `
    <form onsubmit="return updateUser(event, ${id})">
      <div class="form-group"><label>Display Name</label><input type="text" id="eu-display-name" value="${displayName||''}"></div>
      <div class="form-group"><label>New Password (leave blank to keep)</label><input type="password" id="eu-password" minlength="4" placeholder="Leave blank to keep"></div>
      <div class="form-group"><label>Role</label><select id="eu-role"><option value="staff" ${role==='staff'?'selected':''}>Staff</option><option value="admin" ${role==='admin'?'selected':''}>Admin</option></select></div>
      <div class="form-group"><label>Active</label><select id="eu-active"><option value="1" ${isActive?'selected':''}>Yes</option><option value="0" ${!isActive?'selected':''}>No</option></select></div>
      <div class="modal-footer" style="border-top:none;padding:0;margin-top:1rem">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-cyan">Save Changes</button>
      </div>
    </form>
  `);
}

async function updateUser(e, id) {
  e.preventDefault();
  const body = {};
  const pw = document.getElementById('eu-password').value;
  if (pw) body.password = pw;
  body.display_name = document.getElementById('eu-display-name').value.trim() || undefined;
  body.role = document.getElementById('eu-role').value;
  body.is_active = document.getElementById('eu-active').value === '1';
  try {
    const res = await apiPut('/api/dashboard/users/' + id, body);
    if (res.success) { toast(res.message || 'User updated', 'success'); closeModal(); refreshUsers(); }
    else { toast(res.error || 'Failed', 'error'); }
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function deactivateUser(id, username) {
  if (!confirm('Deactivate user "' + username + '"? They will no longer be able to log in.')) return;
  try {
    const res = await apiDelete('/api/dashboard/users/' + id);
    if (res.success) { toast(res.message || 'User deactivated', 'success'); refreshUsers(); }
    else { toast(res.error || 'Failed', 'error'); }
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

// ═══════════ TAB: FINANCE ═══════════
async function loadFinanceTab(container) {
  container.innerHTML = `
    <div class="panel">
      <div class="panel-header">💵 Finance Balances</div>
      <div class="panel-body">
        <div id="finance-content"><div class="loading">Loading...</div></div>

    </div>`;
  try {
    const res = await apiGet('/api/dashboard/finance/balances');
    if (!res.success) {
      document.getElementById('finance-content').innerHTML = '<div class="error">' + (res.error || 'Failed') + '</div>';

    }
    const accounts = res.accounts || [];

    let html = '<div class="kpi-grid" style="margin-bottom:1.5rem">';

      html += `<div class="kpi-card ${a.balance >= 0 ? 'green' : 'red'}">

    html += '<div class="kpi-grid">';
    html += kpiCard('Total Balance', FKS(totals.total_balance), 'cyan');
    html += kpiCard('Store Total', FKS(totals.store_total), 'magenta');
    html += kpiCard('Game Revenue', FKS(totals.game_revenue), 'green');
    html += kpiCard('Food Revenue', FKS(totals.food_revenue), 'amber');
    html += kpiCard('Topup Revenue', FKS(totals.topup_revenue), 'cyan');
    html += kpiCard('Discounts', FKS(totals.discount_total), 'magenta');
    html += kpiCard('Member Liability', FKS(totals.member_liability), 'amber');
    html += kpiCard('Capital Total', FKS(totals.capital_total), 'green');
    html += '</div>';

    document.getElementById('finance-content').innerHTML = html;
  } catch(e) {
    document.getElementById('finance-content').innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

// ═══════════ TAB: ANALYTICS ═══════════
async function loadAnalyticsTab(container) {
  container.innerHTML = '<div class="loading">Loading analytics...</div>';
  try {
    const res = await apiGet('/api/dashboard/analytics/summary');
    const data = res.success ? res.data : {};

    let html = '<div class="kpi-grid">';
    html += kpiCard('30-Day Revenue', FKS(data.revenue_30d || 0), 'cyan');
    html += kpiCard('30-Day Bookings', F(data.bookings_30d || 0), 'green');
    html += kpiCard('Top Game', data.top_game || '—', 'magenta');
    html += kpiCard('Peak Hour', data.peak_hour || '—', 'amber');
    html += '</div>';

    // Sales Trend
    if (data.sales_trend && data.sales_trend.length) {
      html += '<div class="panel"><div class="panel-header">📈 Sales Trend (30 Days)</div><div class="panel-body">';
      html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Revenue</th><th>Bookings</th></tr></thead><tbody>';
      data.sales_trend.forEach(d => {
        html += `<tr><td>${d.date||'-'}</td><td>${FKS(d.revenue)}</td><td>${F(d.bookings)}</td></tr>`;
      });
      html += '</tbody></table></div></div></div>';
    }

    // Peak Hours
    if (data.peak_hours && data.peak_hours.length) {
      html += '<div class="panel"><div class="panel-header">⏰ Peak Hours</div><div class="panel-body">';
      html += '<div class="table-wrap"><table><thead><tr><th>Hour</th><th>Bookings</th></tr></thead><tbody>';
      data.peak_hours.forEach(h => {
        html += `<tr><td>${h.hour||'-'}</td><td>${F(h.count)}</td></tr>`;
      });
      html += '</tbody></table></div></div></div>';
    }

    // Popular Games
    if (data.popular_games && data.popular_games.length) {
      html += '<div class="panel"><div class="panel-header">🎮 Popular Games</div><div class="panel-body">';
      html += '<div class="table-wrap"><table><thead><tr><th>Game</th><th>Plays</th></tr></thead><tbody>';
      data.popular_games.forEach(g => {
        html += `<tr><td>${g.game_title||'-'}</td><td>${F(g.play_count)}</td></tr>`;
      });
      html += '</tbody></table></div></div></div>';
    }

    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div class="error">Error loading analytics: ' + e.message + '</div>';
  }
}

// ═══════════ MODAL HELPERS ═══════════
function showModal(title, bodyHtml) {
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ═══════════ INIT ═══════════
// ═══════════ CHANGE PASSWORD ═══════════
function showChangePwModal() {
  showModal("🔑 Change Password", `
    <form onsubmit="return changePassword(event)">
      <div class="form-group"><label>Current Password</label><input type="password" id="cpw-current" required></div>
      <div class="form-group"><label>New Password</label><input type="password" id="cpw-new" required minlength="4"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" id="cpw-confirm" required minlength="4"></div>
      <div class="modal-footer" style="border-top:none;padding:0;margin-top:1rem">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-cyan">Change Password</button>
      </div>
    </form>
  `);
}

async function changePassword(e) {
  e.preventDefault();
  const currentPw = document.getElementById("cpw-current").value;
  const newPw = document.getElementById("cpw-new").value;
  const confirmPw = document.getElementById("cpw-confirm").value;
  if (newPw !== confirmPw) { toast("Passwords do not match", "error"); return; }
  if (newPw.length < 4) { toast("Password must be at least 4 characters", "error"); return; }
  try {
    const res = await apiPost("/api/dashboard/change-password", {
      current_password: currentPw,
      new_password: newPw
    });
    if (res.success) { toast(res.message || "Password changed", "success"); closeModal(); }
    else { toast(res.error || "Failed", "error"); }
  } catch(err) { toast("Error: " + err.message, "error"); }
}
